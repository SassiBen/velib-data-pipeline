# Pile complète en local : 8 Go de RAM pour Docker suffisent.
name: velib

x-s3: &s3
  S3_ENDPOINT: http://garage:3900
  S3_ENDPOINT_HOST: garage:3900
  S3_REGION: garage
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?définir S3_ACCESS_KEY dans .env}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?définir S3_SECRET_KEY dans .env}

# Airflow en configuration de production : métadonnées dans PostgreSQL,
# LocalExecutor, planificateur et serveur web séparés.
x-airflow-env: &airflow-env
  <<: *s3
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  LAKE_URI_S3: s3://lake
  WAREHOUSE_PATH: /data/warehouse/velib.duckdb
  PUSHGATEWAY: pushgateway:9091

x-airflow: &airflow
  build: ./airflow
  environment: *airflow-env
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./dbt:/opt/dbt
    - warehouse:/data/warehouse

services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    volumes:
      - kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic velib.station_status --partitions 3 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic velib.station_information --partitions 1 --config cleanup.policy=compact

  # Stockage objet compatible S3 : Garage (Deuxfleurs), en nœud unique.
  # Le lac ne dépend que de l'API S3 ; changer de fournisseur ne touche que ce
  # bloc et les variables S3_* (MinIO, par exemple, ne publie plus d'images).
  garage:
    image: dxflrs/garage:v1.1.0
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?définir GARAGE_RPC_SECRET dans .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?définir GARAGE_ADMIN_TOKEN dans .env}
    volumes:
      - ./infra/local/garage.toml:/etc/garage.toml:ro
      - lake-meta:/var/lib/garage/meta
      - lake-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      retries: 20

  s3-init:
    image: python:3.12-slim
    depends_on:
      garage: {condition: service_healthy}
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./infra/local/garage_init.py:/garage_init.py:ro
    command: ["python", "/garage_init.py"]

  producer:
    build: ./producer
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    restart: unless-stopped

  spark:
    image: apache/spark:3.5.3-python3
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      s3-init: {condition: service_completed_successfully}
    environment:
      <<: *s3
      LAKE_URI: s3a://lake
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - ./spark/jobs:/opt/jobs:ro
      - spark-work:/opt/spark/work-dir
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --driver-memory
      - 1g
      - --conf
      - spark.jars.ivy=/opt/spark/work-dir/ivy
      - --packages
      - io.delta:delta-spark_2.12:3.2.1,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,org.apache.hadoop:hadoop-aws:3.3.4
      - --py-files
      - /opt/jobs/transforms.py
      - /opt/jobs/stream.py
    restart: unless-stopped

  airflow-db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?définir AIRFLOW_DB_PASSWORD dans .env}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 12

  airflow-init:
    <<: *airflow
    depends_on:
      airflow-db: {condition: service_healthy}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        airflow db migrate &&
        airflow users create --role Admin --username admin --password "$$AIRFLOW_ADMIN_PASSWORD"
        --firstname Admin --lastname Velib --email admin@example.com || true
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?définir AIRFLOW_ADMIN_PASSWORD dans .env}

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init: {condition: service_completed_successfully}
      s3-init: {condition: service_completed_successfully}
    restart: unless-stopped

  airflow-webserver:
    <<: *airflow
    command: webserver
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway:v1.11.1

  prometheus:
    image: prom/prometheus@sha256:69f5241418838263316593f7274a304b095c40bcf22e57272865da91bd60a8ac
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?définir GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"

  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    profiles: [debug]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  kafka:
  lake-meta:
  lake-data:
  spark-work:
  warehouse:
  airflow-db:
